services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: surplus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: surplus
      POSTGRES_PASSWORD: surplus
      POSTGRES_DB: surplus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: surplus_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
